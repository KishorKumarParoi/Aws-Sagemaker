services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    image: sagemaker-serving:latest
    container_name: sagemaker-serving-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
